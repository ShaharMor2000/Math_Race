server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/math_race?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  security:
    jwt-secret: "replace-with-strong-secret-at-least-32-chars"
    jwt-expiration-minutes: 180
  auth:
    google-client-id: ""
