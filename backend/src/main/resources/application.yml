server:
  port: 8080

spring:
  profiles:
    default: mysql
  config:
    import: optional:classpath:application-local.yml
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  security:
    jwt-secret: "replace-with-strong-secret-at-least-32-chars"
    jwt-expiration-minutes: 180
  auth:
    google-client-id: ${GOOGLE_CLIENT_ID:}
  mail:
    from: ${GMAIL_USERNAME:no-reply@mathrace.local}
